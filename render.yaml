services:
  # 1. Frontend Web (React + Vite SPA)
  - type: web
    name: aulalive-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aulalive-backend
          property: host
        transform: https://{{value}}/api
      - key: VITE_WS_URL
        fromService:
          type: web
          name: aulalive-backend
          property: host
        transform: https://{{value}}

  # 2. Backend API (Node.js + Express + Socket.IO WebSockets)
  - type: web
    name: aulalive-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm run prisma:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: aulalive-postgres
          property: connectionString

# 3. Base de Datos PostgreSQL Gestionada
databases:
  - name: aulalive-postgres
    databaseName: aulalive_db
    user: postgres
    plan: free
